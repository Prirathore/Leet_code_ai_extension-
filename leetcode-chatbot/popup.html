<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LeetCode AI Chatbot</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h2>LeetCode AI Chatbot 🤖</h2>

    <p><strong>Problem:</strong></p>
    <div id="leetcodeProblem">Loading problem...</div>

    <p><strong>Your Code:</strong></p>
    <div id="userCode">Loading code...</div>

    <h3>Chat with AI:</h3>
    <div id="chatbox">
        <div class="message bot">Yo! Ask me anything 😎</div>
    </div>

    <input type="text" id="userInput" placeholder="Type your message..." />
    <button id="sendMessage">Send</button>

    <script src="popup.js"></script>
</body>
</html>
